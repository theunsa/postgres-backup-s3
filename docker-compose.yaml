# Local development/testing rig — fully self-contained, no real S3 needed.
#
#   docker compose up -d --build
#   docker compose run --rm backup sh backup.sh              # ad-hoc backup of every database
#   docker compose run --rm backup sh restore.sh app_one     # restore latest of one database
#   docker compose run --rm backup sh rehearse.sh app_one    # prove it restores, into a scratch db
#   docker compose down -v

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password

  createdbs:
    image: postgres:18
    depends_on:
      - postgres
    environment:
      PGPASSWORD: password
    entrypoint: >
      sh -c "until pg_isready -h postgres -U user; do sleep 1; done &&
             for db in app_one app_two; do
               psql -h postgres -U user -d postgres -tc \"SELECT 1 FROM pg_database WHERE datname = '$$db'\" | grep -q 1 ||
               psql -h postgres -U user -d postgres -c \"CREATE DATABASE $$db\";
             done"

  minio:
    image: minio/minio
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin

  createbucket:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      sh -c "until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done &&
             mc mb --ignore-existing local/test-bucket"

  backup:
    build:
      context: .
      args:
        ALPINE_VERSION: '3.23'
        POSTGRES_VERSION: 18
    depends_on:
      - postgres
      - createdbs
      - createbucket
    environment:
      SCHEDULE: '@hourly'
      BACKUP_KEEP_DAYS: 7
      PASSPHRASE: passphrase
      # MinIO is S3-compatible, so it is just an rclone s3 remote named "minio".
      RCLONE_CONFIG_MINIO_TYPE: s3
      RCLONE_CONFIG_MINIO_PROVIDER: Minio
      RCLONE_CONFIG_MINIO_ENDPOINT: http://minio:9000
      RCLONE_CONFIG_MINIO_REGION: us-east-1
      RCLONE_CONFIG_MINIO_ACCESS_KEY_ID: minioadmin
      RCLONE_CONFIG_MINIO_SECRET_ACCESS_KEY: minioadmin
      RCLONE_REMOTE: minio:test-bucket/backup
      POSTGRES_HOST: postgres
      POSTGRES_DATABASES: app_one app_two
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
